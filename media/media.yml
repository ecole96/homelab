name: media
networks:
  homelab_network:
    external: true
services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.0
    networks:
      - homelab_network
    env_file:
      - ../.new.env
      - .media.env
    container_name: gluetun
    # line above must be uncommented to allow external containers to connect.
    # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/connect-a-container-to-gluetun.md#external-container-to-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 6881:6881 # qbittorrent
      - 6881:6881/udp # qbittorrent
      - 9696:9696 # prowlarr
      - 7878:7878 # radarr
      - 8989:8989 # sonarr
      - 8090:8090 # qbittorrent web UI
      - 8191:8191 # flaresolverr
    volumes:
      - ${CONFIG_DIR}/gluetun:/gluetun
    restart: unless-stopped
    environment:
      # See https://github.com/qdm12/gluetun-wiki/tree/main/setup#setup
      - VPN_SERVICE_PROVIDER=nordvpn
      # options are wireguard or openvpn
      - VPN_TYPE=wireguard
      # Wireguard:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # OpenVPN:
      # - OPENVPN_USER=
      # - OPENVPN_PASSWORD=
      # Timezone for accurate log times
      - TZ=America/Louisville
      # Server list updater
      # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#update-the-vpn-servers-list
      - UPDATER_PERIOD=24h
      - SERVER_COUNTRIES=United States
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.0
    container_name: prowlarr
    env_file:
      - ../.new.env
    network_mode: "service:gluetun"
    environment:
      - TZ=America/Louisville
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    restart: unless-stopped
    depends_on:
      - gluetun
  radarr:
    restart: unless-stopped
    container_name: radarr
    env_file:
      - ../.new.env
      - .media.env
    network_mode: "service:gluetun"
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${MEDIA_DIR}:/data
    environment:
      - TZ=America/Louisville
      - PUID=${PUID}
      - PGID=${PGID}
    image: lscr.io/linuxserver/radarr:6.0.4
    depends_on:
      - gluetun
  sonarr:
    restart: unless-stopped
    container_name: sonarr
    env_file:
      - ../.new.env
      - .media.env
    network_mode: "service:gluetun"
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/data
    environment:
      - TZ=America/Louisville
      - PUID=${PUID}
      - PGID=${PGID}
    image: lscr.io/linuxserver/sonarr:4.0.16
    depends_on:
      - gluetun
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    env_file:
      - ../.new.env
      - .media.env
    network_mode: "service:gluetun"
    environment:
      - TZ=America/Louisville
      - WEBUI_PORT=8090
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${MEDIA_DIR}/torrents:/data/torrents
    restart: unless-stopped
    depends_on:
      - gluetun
  # jellyfin:
  #   image: lscr.io/linuxserver/jellyfin:latest
  #   container_name: jellyfin
  #   env_file:
  #     - ../.new.env
  #     - .media.env
  #   networks:
  #     - homelab_network
  #   environment:
  #     - TZ=America/Louisville
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - UMASK_SET=022 # optional
  #   volumes:
  #     - ${CONFIG_DIR}/jellyfin:/config
  #     - ${MEDIA_DIR}/media:/data/media
  #   ports:
  #     - 8096:8096
  #   restart: unless-stopped
  flaresolverr:
    image: flaresolverr/flaresolverr:v3.4.6
    network_mode: "service:gluetun"
    container_name: flaresolverr
    environment:
      - TZ=America/Louisville
    restart: unless-stopped
    depends_on:
      - gluetun
